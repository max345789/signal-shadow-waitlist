name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/trust_marketplace?schema=public"
      AUTH_SECRET: "ci-verification-secret-at-least-32-characters-long"
      NEXT_PUBLIC_DEFAULT_CURRENCY: "INR"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema and generate client
        run: |
          npm run db:validate
          npm run db:generate

      - name: Lint
        run: npm run lint

      - name: TypeScript type check
        run: npm run typecheck

      - name: Unit, component, and design-system contrast tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    env:
      DATABASE_URL: ""
      AUTH_SECRET: "ci-e2e-secret-at-least-32-characters-long"
      AUTH_PROVIDER: "local-dev"
      NEXT_PUBLIC_DEFAULT_CURRENCY: "INR"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        run: npx playwright install --with-deps chromium

      - name: Build for E2E
        run: npm run build

      - name: Run E2E tests
        run: npm run test:e2e
